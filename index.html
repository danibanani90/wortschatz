<style>
:root {
  --bg: #FAF6EC;
  --surface: #FFFFFF;
  --surface-2: #F1ECDD;
  --ink: #2E2B24;
  --ink-soft: #6B6555;
  --line: #E4DBC5;
  --accent: #3E6D9C;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7EFF7;
  --gold: #C68A2E;
  --good: #3F8F5F;
  --good-bg: #E7F3EB;
  --warn: #C8891A;
  --warn-bg: #FBF0DC;
  --bad: #C1483A;
  --bad-bg: #FBEAE7;
  --old-tag-bg: #EFE6F5;
  --old-tag-ink: #6C4E8C;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(46,43,36,0.06), 0 10px 28px -14px rgba(46,43,36,0.20);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1B17;
    --surface: #272521;
    --surface-2: #322F28;
    --ink: #F0EAE0;
    --ink-soft: #ACA290;
    --line: #423E34;
    --accent: #7FADDD;
    --accent-ink: #16232F;
    --accent-soft: #22344A;
    --gold: #E0AB4E;
    --good: #6FBF8B;
    --good-bg: #1E3327;
    --warn: #E0AB4E;
    --warn-bg: #3A2E15;
    --bad: #E08476;
    --bad-bg: #3A231F;
    --old-tag-bg: #372E44;
    --old-tag-ink: #C9AEE0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1B17;
  --surface: #272521;
  --surface-2: #322F28;
  --ink: #F0EAE0;
  --ink-soft: #ACA290;
  --line: #423E34;
  --accent: #7FADDD;
  --accent-ink: #16232F;
  --accent-soft: #22344A;
  --gold: #E0AB4E;
  --good: #6FBF8B;
  --good-bg: #1E3327;
  --warn: #E0AB4E;
  --warn-bg: #3A2E15;
  --bad: #E08476;
  --bad-bg: #3A231F;
  --old-tag-bg: #372E44;
  --old-tag-ink: #C9AEE0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-inline: 16px;
  padding-block: 20px;
}
h1, h2, h3 { font-family: "Fredoka", "Karla", system-ui, sans-serif; text-wrap: balance; margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 4px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark {
  width: 40px; height: 40px; border-radius: 13px; background: var(--accent);
  color: var(--accent-ink); display: flex; align-items: center; justify-content: center;
  font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 18px; flex: none;
}
.brand h1 { font-size: 19px; font-weight: 600; color: var(--ink); }
.brand .tag { font-size: 12px; color: var(--ink-soft); }

button {
  font-family: inherit; font-size: 15px; cursor: pointer; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 16px; transition: transform .08s ease, background .15s ease;
}
button:active { transform: scale(0.97); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: default; }
button.small { padding: 6px 12px; font-size: 13px; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
}
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.old { background: var(--old-tag-bg); color: var(--old-tag-ink); }
.pill.book { background: var(--good-bg); color: var(--good); }

/* Delfine */
.dol-total { display:inline-flex; align-items:center; gap:5px; padding:5px 11px; border-radius:999px; background: var(--accent-soft); color: var(--accent); font-weight:700; font-size:15px; font-family:"Fredoka","Karla",sans-serif; white-space:nowrap; }
.dol-total.bump { animation: dolBump .7s ease; }
@keyframes dolBump { 0%{transform:scale(1)} 35%{transform:scale(1.35) rotate(-6deg)} 70%{transform:scale(.95)} 100%{transform:scale(1)} }
.dol-slots { display:inline-flex; gap:2px; }
.dol-slot { font-size:15px; opacity:.22; filter:grayscale(1); }
.dol-slot.on { opacity:1; filter:none; }
.dol-row { min-height:20px; }
.dol-slots.big { gap:10px; }
.dol-slots.big .dol-slot { font-size:44px; }
.dol-slot.new { animation: dolPop .8s .9s cubic-bezier(.2,1.4,.4,1) backwards; }
@keyframes dolPop { 0%{transform:scale(0) rotate(-40deg);opacity:0} 60%{transform:scale(1.6) rotate(12deg);opacity:1} 100%{transform:scale(1) rotate(0)} }
.dol-card { background: linear-gradient(180deg, var(--accent-soft), var(--surface) 60%); overflow:hidden; }
.dol-stage { position:relative; height:130px; width:100%; overflow:hidden; }
.dol-jump { position:absolute; bottom:12px; left:2%; animation: dolX 2.8s linear infinite; z-index:1; }
.dol-jump span { display:block; font-size:50px; line-height:1; animation: dolY 2.8s infinite; }
@keyframes dolX { from{left:80%} to{left:2%} }
@keyframes dolY {
  0%   { transform: translateY(34px) rotate(60deg); animation-timing-function: cubic-bezier(.2,.7,.3,1); }
  50%  { transform: translateY(-62px) rotate(0deg);  animation-timing-function: cubic-bezier(.7,0,.8,.3); }
  100% { transform: translateY(34px) rotate(-60deg); }
}
.dol-waves { position:absolute; left:0; right:0; bottom:-6px; text-align:center; font-size:34px; line-height:1; letter-spacing:-2px; white-space:nowrap; z-index:2; animation: dolWave 1.8s ease-in-out infinite; }
@keyframes dolWave { 0%,100%{transform:translateX(-6px)} 50%{transform:translateX(6px)} }
.dol-spark { position:absolute; font-size:20px; animation: dolSpark 1.6s ease-in-out infinite; }
@keyframes dolSpark { 0%,100%{opacity:0;transform:scale(.4)} 50%{opacity:1;transform:scale(1.2)} }
.dol-note { padding:12px 14px; border-radius:12px; background: var(--accent-soft); color: var(--ink); font-size:14px; text-align:center; width:100%; }
.dol-summary { font-size:13px; color: var(--ink-soft); margin-bottom:10px; }
/* Ziele */
.goal-row { display:grid; grid-template-columns: minmax(0,1fr) 72px; gap:4px 10px; align-items:center; margin:6px 0; }
.goal-row .lbl { font-size:14px; }
.goal-row .val { font-size:13px; text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
.goal-row .goal-track { grid-column: 1 / -1; height:10px; border-radius:999px; background: var(--surface-2); overflow:hidden; }
.goal-row .goal-fill { height:100%; border-radius:999px; transition: width .4s ease; }
.goal-msg { padding:10px 12px; border-radius:12px; font-size:14px; font-weight:600; line-height:1.4; }
.goal-msg.green, .goal-msg.reached { background: var(--good-bg); color: var(--good); }
.goal-msg.yellow, .goal-msg.missed { background: var(--warn-bg); color: var(--warn); }
.goal-msg.red { background: var(--bad-bg); color: var(--bad); }
.goal-head { font-family:"Fredoka",sans-serif; font-size:17px; font-weight:600; }
.goal-sub { font-size:13px; color: var(--ink-soft); }
.goal-steps { display:flex; flex-direction:column; gap:8px; }
.goal-step { display:flex; gap:10px; align-items:flex-start; font-size:14px; }
.goal-step .ico { width:24px; text-align:center; flex:none; }
.dol-next { display:block; font-size:11px; color: var(--ink-soft); margin-top:2px; }
#simBox { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; font-weight:600; }
#simBox input { font: inherit; padding:4px 8px; border-radius:8px; border:1px solid var(--warn); background: var(--surface); color: var(--ink); }
@media (prefers-reduced-motion: reduce) {
  .dol-jump, .dol-jump span, .dol-waves, .dol-slot.new, .dol-total.bump, .dol-spark { animation: none !important; }
  .dol-jump { left:46%; } .dol-spark { opacity:1; }
}

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow);
}

.hero {
  background: linear-gradient(135deg, var(--accent-soft), var(--surface));
  border: 1px solid var(--line); border-radius: var(--radius); padding: 22px;
  display: flex; flex-direction: column; gap: 4px;
}
.hero .greeting { font-family: "Fredoka", sans-serif; font-size: 24px; }
.hero .sub { color: var(--ink-soft); font-size: 14px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.chapter-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left;
}
.chapter-card .num { font-family: "Fredoka", sans-serif; font-size: 13px; color: var(--accent); font-weight: 600; }
.chapter-card .count { font-size: 12px; color: var(--ink-soft); }
.chapter-card:hover { border-color: var(--accent); }
.mastery-track { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.mastery-fill { height: 100%; border-radius: 999px; }
.mastery-label { font-size: 11px; color: var(--ink-soft); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.direction-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.direction-toggle button { border: none; border-radius: 0; }
.direction-toggle button.active { background: var(--accent); color: var(--accent-ink); }

table.vocab-table { width: 100%; border-collapse: collapse; font-size: 15px; }
table.vocab-table th { text-align: left; font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; padding-block: 6px; border-bottom: 1px solid var(--line); }
table.vocab-table td { padding-block: 8px; border-bottom: 1px solid var(--line); }
table.vocab-table tr:last-child td { border-bottom: none; }

.progress-row { display: flex; align-items: center; gap: 10px; }
.progress-track { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .2s ease; }

.quiz-prompt { font-family: "Fredoka", sans-serif; font-size: 28px; text-align: center; margin-block: 6px; }
.quiz-sub { text-align: center; color: var(--ink-soft); font-size: 13px; }
input[type=text] {
  width: 100%; font-size: 18px; font-family: inherit; padding: 12px 14px; border-radius: 12px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
}
input[type=text]:focus { outline: none; border-color: var(--accent); }
.feedback { text-align: center; font-weight: 600; font-size: 15px; min-height: 20px; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }

.wordline {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-block: 8px; border-bottom: 1px solid var(--line); font-size: 14px; flex-wrap: wrap;
}
.wordline:last-child { border-bottom: none; }
.wordline .words { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.wordline .en { font-weight: 600; }
.wordline .de { color: var(--ink-soft); }
.tally { font-size: 12px; font-family: "JetBrains Mono", ui-monospace, monospace; }
.tally.good { color: var(--good); } .tally.warn { color: var(--warn); } .tally.bad { color: var(--bad); }

.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin-bottom: 4px; }
.group-heading { font-family: "Fredoka", sans-serif; font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: -6px; }
.big-check { font-family: "Fredoka", sans-serif; font-size: 22px; text-align: center; }
.center-col { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
footer.crumbs { font-size: 12px; color: var(--ink-soft); text-align: center; padding-block: 6px; }
[hidden] { display: none !important; }
@media (max-width: 520px) {
  .btn-label { display: none; }
  .brand .mark { width: 34px; height: 34px; font-size: 16px; }
  .brand h1 { font-size: 17px; }
  header.top { gap: 8px; }
  header.top > div:last-child { flex-shrink: 0; }
  .brand { min-width: 0; }
  .brand .tag { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
</style>

function normalize(str) {
  return (str || '')
    .toLowerCase()
    .replace(/[«»„“”"]/g, ' ')   // Anführungszeichen sind freiwillig
    .replace(/…|\.{2,}/g, ' ')    // Auslassungspunkte: "um … herum" = "um...herum" = "um herum"

// Englische Kurzformen und Langformen gelten als gleich (he's = he is, can't = cannot ...).
function canon(s) {
  return s
    .replace(/\bcan't\b/g, 'cannot').replace(/\bcan not\b/g, 'cannot')
    .replace(/\bwon't\b/g, 'will not')
    .replace(/\bshan't\b/g, 'shall not')
    .replace(/(\w)n't\b/g, '$1 not')
    .replace(/\bi'm\b/g, 'i am')
    .replace(/\b(you|we|they)'re\b/g, '$1 are')
    .replace(/\b(i|you|we|they)'ve\b/g, '$1 have')
    .replace(/\b(i|you|he|she|it|we|they|that|there)'ll\b/g, '$1 will')
    .replace(/\b(i|you|he|she|it|we|they)'d\b/g, '$1 would')
    .replace(/\blet's\b/g, 'let us')
    .replace(/\b(he|she|it|that|there|here|what|who|where|how|when|why)'s\b/g, '$1 is')
    .replace(/\s+/g, ' ')
    .trim()
    .replace(/\b(sth|sb|smth|smb|jmdn|jmdm|jmds|jmd|etw)\./g, '$1')   // Abkürzungen: sth = something, jmdn. = jemanden ...
    .replace(/\b(something|smth)\b/g, 'sth')
    .replace(/\b(somebody|someone|smb)\b/g, 'sb')
    .replace(/\bjemanden\b/g, 'jmdn').replace(/\bjemandem\b/g, 'jmdm').replace(/\bjemandes\b/g, 'jmds')
    .replace(/\bjemand\b/g, 'jmd').replace(/\betwas\b/g, 'etw');
}

// Platzhalter wie "sth", "sb", "jmdn.", "etw." darf man auch weglassen ("to give sth a try" -> "to give a try").
const OMITTABLE = new Set(['sth', 'sb', 'jmdn', 'jmdm', 'jmd', 'etw']);
const HAS_PLACEHOLDER = /(^|[^\p{L}])(sth|sb|jmdn|jmdm|jmd|etw)(\.|[^\p{L}']|$)/u;
function withoutPlaceholders(n) {
  const toks = n.split(' ');
  const idx = toks.map((t, i) => OMITTABLE.has(t.replace(/,$/, '')) ? i : -1).filter(i => i >= 0).slice(0, 4);
  const out = [];
  for (let mask = 1; mask < (1 << idx.length); mask++) {
    const drop = new Set(idx.filter((_, k) => mask & (1 << k)));
    const v = toks.filter((_, i) => !drop.has(i)).join(' ').replace(/\s*,\s*$/, '').trim();
    if (v && hasLetter(v)) out.push(v);
  }
  return out;
}

// "sb/sth" bzw. "jmdn./etw." ist eine Wahl zwischen zwei Platzhaltern, keine Alternative für die ganze Wortgruppe.
const PH_SLASH = /(^|\s)(sb|sth|jmdn\.?|jmdm\.?|jmd\.?|etw\.?)\/(sb|sth|jmdn\.?|jmdm\.?|jmd\.?|etw\.?)(?=[\s,]|$)/i;
function splitPlaceholderSlash(seg) {
  const m = seg.match(PH_SLASH);
  if (!m) return [seg];
  const at = m.index + m[1].length, len = m[0].length - m[1].length;
  return [m[2], m[3]].flatMap(p => splitPlaceholderSlash(seg.slice(0, at) + p + seg.slice(at + len)));
}

const MAX_VARIANTS = 80;
const hasLetter = (w) => /[\p{L}\p{N}]/u.test(w);

// Klammern sind optional: "(sich) ändern", "Komm(t)", "(zu/nach)", "(pl)" ...
function expandParens(text) {
  const eq = text.match(/\(\s*=\s*([^)]*)\)/);
  if (eq) {   // "we're (= we are)" -> zwei gleichwertige Varianten
    const base = text.replace(eq[0], ' ').trim();
    return expandParens(base).concat(expandParens(eq[1].trim()));
  }
  const re = /\(([^)]*)\)/g;
  const pieces = []; let last = 0, m;
  while ((m = re.exec(text))) {
    pieces.push({ lit: text.slice(last, m.index) });
    pieces.push({ opt: ['', m[1].trim()] });
    last = m.index + m[0].length;
  }
  if (!pieces.length) return [text];
  pieces.push({ lit: text.slice(last) });
  let results = [''];
  for (const pc of pieces) {
    if (pc.lit !== undefined) results = results.map(r => r + pc.lit);
    else {
      const next = [];
      results.forEach(r => pc.opt.forEach(o => next.push(r + o)));
      results = next.slice(0, MAX_VARIANTS);
    }
  }
  return results;
}

const isSuffixPart = (part, base) => part.startsWith('-') || (part.length === 1 && base.length >= 3);

// Schrägstriche: Endungen ("Erwachsene/-r") und Alternativen ("Schau/Schaut mal", "un ami/une amie")
function expandSlashes(seg) {
  if (!seg.includes('/')) return [seg];
  const words = seg.split(/\s+/);
  const info = words.map((w, i) => {
    if (!w.includes('/')) return null;
    const parts = w.split('/');
    return { i, parts, suffixLike: parts.slice(1).every(p => isSuffixPart(p, parts[0])) };
  }).filter(Boolean);
  const hasWordBefore = (i) => words.slice(0, i).some(hasLetter);
  const hasWordAfter = (i) => words.slice(i + 1).some(hasLetter);
  const altTokens = info.filter(t => !t.suffixLike);
  const phraseLevel = altTokens.length >= 2 || altTokens.some(t => hasWordBefore(t.i) && hasWordAfter(t.i));

  if (!phraseLevel) {
    let results = [''];
    words.forEach((w, idx) => {
      const t = info.find(x => x.i === idx);
      const opts = !t ? [w] : t.parts.map((p, k) => k === 0 ? p : (isSuffixPart(p, t.parts[0]) ? t.parts[0] + p.replace(/^-/, '') : p));
      const next = [];
      results.forEach(r => opts.forEach(o => next.push(r ? r + ' ' + o : o)));
      results = next.slice(0, MAX_VARIANTS);
    });
    return results;
  }

  // Ganze Wortgruppen sind Alternativen ("Woher kommst du/kommt ihr/kommen Sie?")
  const parts = seg.split('/').map(x => x.trim()).filter(Boolean);
  const out = new Set(parts);
  const p0 = parts[0].split(/\s+/);
  const pn = parts[parts.length - 1].split(/\s+/);
  for (let i = 1; i < parts.length; i++) {
    const pw = parts[i].split(/\s+/);
    for (let k = 1; k <= Math.min(pw.length, p0.length - 1); k++) out.add(p0.slice(0, p0.length - k).concat(pw).join(' '));
  }
  for (let m = 1; m < pn.length; m++) out.add(parts[0] + ' ' + pn.slice(pn.length - m).join(' '));
  return [...out].slice(0, MAX_VARIANTS);
}

function expandVariants(seg) {
  const out = [];
  expandParens(seg).forEach(v => expandSlashes(v).forEach(x => out.push(x)));
  return out;
}

function acceptableAnswers(text) {
  const out = new Set();
  (text || '').split(';').forEach(seg => {
    seg = seg.trim();
    if (!seg) return;
    const all = [seg];
    try { splitPlaceholderSlash(seg).forEach(p => { all.push(p); expandVariants(p).forEach(v => all.push(v)); }); } catch (e) { /* Rückfall: nur Originaltext */ }
    const omit = HAS_PLACEHOLDER.test(seg.toLowerCase());
    all.forEach(v => { const n = canon(normalize(v)); if (!n) return; out.add(n); if (omit) withoutPlaceholders(n).forEach(x => out.add(x)); });
  });
  return [...out];
}
function checkAnswer(userInput, word) {
  const target = word.quizDir === 'f2de' ? word.de : word.foreign;
  const accepted = acceptableAnswers(target);
  const given = canon(normalize(userInput));
  if (accepted.includes(given)) return true;
  // Deutsch: Apostroph ist freiwillig ("Wie geht's?" = "Wie gehts?"), auf Englisch/Französisch nicht (it's ≠ its)
  if (word.quizDir === 'f2de') { const noApo = (x) => x.replace(/'/g, ''); return accepted.map(noApo).includes(noApo(given)); }
  return false;
}
// Französisch: Lag der Fehler nur an Akzenten/Sonderzeichen? ("ca va" statt "ça va", "soeur" statt "sœur")
const foldChar = (c) => c === 'œ' ? 'oe' : c === 'æ' ? 'ae' : c.normalize('NFD').replace(/\p{M}/gu, '');
const foldStr = (s) => [...s].map(foldChar).join('');
function accentOnlyDiff(userInput, word) {
  if (word.quizDir === 'f2de') return null;
  const given = canon(normalize(userInput));
  const fg = foldStr(given);
  const target = acceptableAnswers(word.foreign).find(a => a !== given && foldStr(a) === fg);
  if (!target) return null;
  const g = [...given], gStart = []; let p = 0;
  g.forEach(c => { gStart.push(p); p += foldChar(c).length; });
  const diffs = []; p = 0;
  for (const c of target) {
    const len = foldChar(c).length;
    const got = g.filter((_, i) => gStart[i] >= p && gStart[i] < p + len).join('');
    if (got !== c && !diffs.some(d => d.want === c && d.got === got)) diffs.push({ want: c, got });
    p += len;
  }
  return diffs.length ? diffs : null;
}
function accentHintText(diffs) {
  const what = diffs.map(d => '„' + d.want + '“ statt „' + (d.got || '–') + '“').join(' und ');
  const keys = [...new Set(diffs.map(d => d.want === 'œ' ? 'o' : foldStr(d.want).charAt(0)))].map(k => 'das ' + k);
  return 'Fast! Hier gehört ' + what + ' hin. Tipp: Halte auf der Tastatur ' + keys.join(' bzw. ') +
    ' lange gedrückt und wähle das richtige Zeichen. Verbessere dein Wort und prüfe nochmal.';
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Weighted sampling without replacement (Efraimidis–Spirakis A-Res).
function weightedSample(items, k) {
  if (items.length <= k) return shuffle(items);
  const scored = items.map(it => ({ it, key: -Math.log(Math.random()) / Math.max(it.weight, 0.0001) }));
  scored.sort((a, b) => a.key - b.key); // kleinster Schlüssel = hohe Gewichtung zuerst
  return scored.slice(0, k).map(s => s.it);
}

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

// Baut einen gewichteten Wortpool aus den Kapiteln [0, upTo) eines Buches.
// src: { chapters, statsCollection, statsMap, bookLabel (nur bei Vorgängerbuch) }

// Wiederholungswörter: frühere Lektionen des aktuellen Buches + (falls vorhanden)
// abgeschlossene Vorgängerbücher (z. B. Green Line 1 beim Lernen von Green Line 2).

// Abgeschlossene Vorgängerbücher derselben Sprache (mit ihren Statistiken).
// Welche Lektionen hat Chris schon selbst als Abfrage eingereicht? (aus dem Blatt "Ergebnisse")
// null = unbekannt (altes Google-Skript) -> bisheriges Verhalten.
function practicedLessons() {
  const ld = apiCache.learningDays && apiCache.learningDays.docs && apiCache.learningDays.docs.list;
  if (!Array.isArray(ld)) return null;
  const set = new Set();
  ld.forEach(r => { if (r && r.lesson) set.add((r.lang || '') + '|' + (r.book || '') + '|' + r.lesson); });
  return set;
}
function isPracticed(set, langKey, bookLabel, title) { return set.has(langKey + '|' + (bookLabel || '') + '|' + title); }

// Baut einen gewichteten Wortpool aus den Kapiteln, für die include(ci, ch) true ist.
// src: { chapters, statsCollection, statsMap, bookLabel (nur bei Vorgängerbuch) }
function buildPool(src, include, foreignField) {
  const pool = [];
  src.chapters.forEach((ch, ci) => {
    if (!include(ci, ch)) return;
    ch.words.forEach(w => {
      const s = src.statsMap[w.wid];
      const wrong = s ? (s.wrong || 0) : 0;
      const correct = s ? (s.correct || 0) : 0;
      const weight = Math.max(0.4, 1 + 3 * wrong - 0.5 * correct);
      pool.push({
        foreign: w[foreignField], de: w.de, wid: w.wid, chapterIdx: ci, weight,
        statsCollection: src.statsCollection,
        srcBook: src.bookLabel || null,
        srcTitle: src.bookLabel ? (src.bookLabel + ' · ' + ch.title) : ch.title,
      });
    });
  });
  return pool;
}

// Wiederholungswörter: NUR aus Lektionen, die Chris schon selbst eingereicht hat
// (aktuelles Buch + abgeschlossene Vorgängerbücher). Anfangs sind es dadurch weniger als 20.
function pickExtraWords(cfg, chapterIdx, statsMap, prevBooks) {
  const n = EXTRA_WORD_COUNT;
  const done = practicedLessons();
  const sameInclude = done
    ? (ci, ch) => ci !== chapterIdx && isPracticed(done, cfg.key, cfg.bookLabel, ch.title)
    : (ci) => ci < chapterIdx;   // altes Google-Skript: wie bisher
  const samePool = buildPool({ chapters: cfg.chapters, statsCollection: cfg.statsCollection, statsMap }, sameInclude, cfg.foreignField);
  let prevPool = [];
  (prevBooks || []).forEach(pb => {
    const inc = done ? (ci, ch) => isPracticed(done, cfg.key, pb.bookLabel, ch.title) : () => true;
    prevPool = prevPool.concat(buildPool(pb, inc, cfg.foreignField));
  });

  if (!prevPool.length) return weightedSample(samePool, n);
  if (!samePool.length) return weightedSample(prevPool, n);

  // Halbe-halbe; Unterschuss wird mit dem jeweils anderen Pool aufgefüllt.
  let nPrev = Math.ceil(n / 2);
  let nSame = n - nPrev;
  if (samePool.length < nSame) { nPrev += nSame - samePool.length; nSame = samePool.length; }
  if (prevPool.length < nPrev) { nSame = Math.min(samePool.length, nSame + nPrev - prevPool.length); nPrev = prevPool.length; }
  return weightedSample(prevPool, nPrev).concat(weightedSample(samePool, nSame));
}

async function loadPrevBooks(langKey, bookIdx) {
  const lang = LANGS[langKey];
  if (!lang.books || bookIdx == null) return [];
  const prev = lang.books.slice(0, bookIdx).filter(b => b.completed);
  return Promise.all(prev.map(async b => ({
    chapters: b.chapters,
    statsCollection: b.statsCollection,
    bookLabel: b.label,
    statsMap: await fetchStatsMap({ statsCollection: b.statsCollection }),
  })));
}

function goalFacts_(dolphinDocs, learningDays) {

function goalValuesAt_(facts, date) {
  const d = gDay_(date);
  const cnt = arr => arr.filter(x => gDay_(x) <= d).length;
  return { en: cnt(facts.dolphinDates.en), fr: cnt(facts.dolphinDates.fr), days: cnt(facts.dayDates) };
}

function goalStatus_(facts, today) {
  const t = gDay_(today);
  const cur = goalValuesAt_(facts, today);
  const ms = GOALS.milestones;
  const final = ms[ms.length - 1];
  const rank = { green: 0, yellow: 1, red: 2 };
  const missingOf = (m, v) => GOAL_METRICS.filter(x => v[x.key] < m[x.key])
    .map(x => ({ key: x.key, label: x.label, flag: x.flag, missing: m[x.key] - v[x.key] }));

  const passed = ms.filter(m => gDay_(m.date) < t).map(m => {
    const v = goalValuesAt_(facts, m.date);
    const missing = missingOf(m, v);
    return { m, values: v, reached: missing.length === 0, missing, daysAgo: t - gDay_(m.date) };
  });
  const lastPassed = passed.length ? passed[passed.length - 1] : null;
  const idx = ms.findIndex(m => gDay_(m.date) >= t);
  if (idx < 0) return { today, cur, final, next: null, passed, lastPassed, finished: true, overall: lastPassed.reached ? 'green' : 'red', metrics: [] };

  const next = ms[idx];
  const prev = idx > 0 ? ms[idx - 1] : { date: GOALS.planStart, en: 0, fr: 0, days: 0 };
  // Plan der aktuellen Etappe startet beim TATSÄCHLICHEN Stand am letzten Zwischenziel (falls darunter),
  // damit ein verpasstes Zwischenziel nicht sofort "rot" macht – aufholen bis zum nächsten reicht.
  const prevActual = idx > 0 ? goalValuesAt_(facts, prev.date) : { en: 0, fr: 0, days: 0 };
  const p0 = gDay_(prev.date), p1 = gDay_(next.date);
  const span = Math.max(1, p1 - p0);
  const frac = Math.max(0, Math.min(1, (t - p0) / span));
  const fracWeek = Math.max(0, Math.min(1, (t + 7 - p0) / span));
  const daysLeft = p1 - t + 1;   // inkl. heute

  const metrics = GOAL_METRICS.map(x => {
    const target = next[x.key], have = cur[x.key];
    const start = Math.min(prev[x.key], prevActual[x.key]);
    const expected = start + (target - start) * frac;
    const expectedWeek = start + (target - start) * fracWeek;
    let status;
    if (have >= target) status = 'green';
    else if (x.key === 'days' && target - have > daysLeft) status = 'red';      // rechnerisch nicht mehr möglich
    else if (expected <= 0 || have >= GOALS.greenAt * Math.floor(expected)) status = 'green';   // ganze Delfine/Tage
    else if (have >= GOALS.yellowAt * expected) status = 'yellow';
    else status = 'red';
    const catchUp = Math.max(1, Math.ceil(expectedWeek - have));
    return { key: x.key, label: x.label, flag: x.flag, have, target, expected, status,
             catchUp: x.key === 'days' ? Math.min(7, catchUp) : catchUp, finalTarget: final[x.key] };
  });
  const overall = metrics.reduce((w, m) => (rank[m.status] > rank[w] ? m.status : w), 'green');

  const h0 = idx > 0 ? p0 + 1 : p0;   // Etappe beginnt am Tag nach dem letzten Zwischenziel
  const midDay = h0 + Math.floor((p1 - h0) / 2);
  const half = { date: gStr_(midDay), upcoming: t <= midDay };
  GOAL_METRICS.forEach(x => { half[x.key] = Math.ceil((prev[x.key] + next[x.key]) / 2); });
  if (!half.upcoming) {
    const hv = goalValuesAt_(facts, half.date);
    half.values = hv;
    half.reached = GOAL_METRICS.every(x => hv[x.key] >= half[x.key]);
  }
  return { today, cur, final, next, prev, metrics, overall, half, daysLeft, passed, lastPassed, finished: false };
}

// Freigegebene Formulierungen. audience: 'kid' (Chris in der App) oder 'parent' (Eltern-Mail).
function goalMessages_(st, audience, name) {
  const out = [];
  const lp = st.lastPassed;
  const nextLong = st.next ? gLong_(st.next.date) : '';
  if (lp && lp.daysAgo <= GOALS.recentDays && !lp.m.final) {
    if (lp.reached) {
      out.push({ type: 'reached', text: audience === 'kid'
        ? '🎉 ' + lp.m.name + ' geschafft! Wie stark ist das denn, ' + name + '? Dein nächstes Ziel: ' + nextLong + '.'
        : '🎉 ' + name + ' hat das ' + lp.m.name + ' (' + gFmt_(lp.m.date) + ') geschafft!' });
    } else {
      const miss = lp.missing.map(x => x.missing + ' ' + x.label).join(', ');
      out.push({ type: 'missed', text: audience === 'kid'
        ? 'Das ' + lp.m.name + ' vom ' + gLong_(lp.m.date) + ' hat diesmal nicht ganz geklappt – und das ist überhaupt nicht schlimm! Du kannst alles bis zum nächsten Zwischenziel am ' + nextLong + ' aufholen. Am Ende zählt dein großes Ziel. 💪'
        : lp.m.name + ' (' + gFmt_(lp.m.date) + ') wurde nicht ganz erreicht – es fehlen ' + miss + '. ' + name + ' kann das bis zum nächsten Zwischenziel am ' + gFmt_(st.next ? st.next.date : st.final.date) + ' aufholen.' });
    }
  }
  if (st.finished) {
    out.push({ type: st.lastPassed.reached ? 'reached' : 'missed', text: st.lastPassed.reached
      ? (audience === 'kid' ? '🏆 Du hast dein großes Ziel geschafft, ' + name + '! Unglaublich stark!' : '🏆 ' + name + ' hat das Endziel erreicht!')
      : (audience === 'kid' ? 'Das große Ziel ist vorbei – und du hast richtig viel gelernt, ' + name + '! 💪' : 'Das Endziel ist vorbei. Fehlend: ' + st.lastPassed.missing.map(x => x.missing + ' ' + x.label).join(', ') + '.') });
    return out;
  }
  const isFinal = !!st.next.final;
  if (st.overall === 'green') {
    out.push({ type: 'green', text: audience === 'kid'
      ? 'Super, ' + name + '! 🐬 Du bist voll im Plan für dein nächstes Ziel. Weiter so!'
      : name + ' ist im Plan für ' + (isFinal ? 'das Endziel.' : 'das nächste Zwischenziel.') });
  } else if (st.overall === 'yellow') {
    const lagging = st.metrics.filter(m => m.status !== 'green');
    const daysM = lagging.find(m => m.key === 'days');
    const dol = lagging.filter(m => m.key !== 'days');
    const langName = k => (k === 'en' ? 'Englisch' : 'Französisch');
    if (audience === 'kid') {
      const parts = [];
      if (daysM) parts.push('an ' + daysM.catchUp + ' ' + (daysM.catchUp === 1 ? 'Tag' : 'Tagen') + ' übst');
      if (dol.length) parts.push(dol.map((m, i) => m.catchUp + (i === 0 ? ' ' + (m.catchUp === 1 ? 'Delfin' : 'Delfine') : '') + ' in ' + langName(m.key)).join(' und ') + ' holst');
      out.push({ type: 'yellow', text: 'Du bist ein kleines bisschen hinter dem Plan – das ist kein Problem! Wenn du diese Woche ' + parts.join(' und ') + ', bist du wieder voll dabei. 💪' });
    } else {
      const parts = [];
      if (daysM) parts.push('etwa ' + daysM.catchUp + ' Lerntagen pro Woche');
      if (dol.length) parts.push(dol.map(m => m.catchUp + ' ' + (m.catchUp === 1 ? 'Delfin' : 'Delfinen') + ' ' + langName(m.key)).join(' und ') + ' in dieser Woche');
      out.push({ type: 'yellow', text: name + ' ist etwas hinter dem Plan. Mit ' + parts.join(' und ') + ' holt er das wieder auf – ein kleiner Anstoß kann jetzt helfen.' });
    }
  } else {
    out.push({ type: 'red', text: audience === 'kid'
      ? (isFinal
        ? 'Dein großes Ziel wird ganz schön knapp. Gib nicht auf – jeder Tag, an dem du übst, bringt dich näher ran! 🏆'
        : 'Dieses Zwischenziel wird ganz schön knapp. Keine Sorge: Zwischenziele sind nur Etappen – am Ende zählt dein großes Ziel am ' + gLong_(st.final.date) + '. 🏆 Jeder Tag, an dem du übst, bringt dich näher ran!')
      : (isFinal
        ? 'Das Endziel wird knapp. Ermutigung hilft jetzt mehr als Druck.'
        : 'Das nächste Zwischenziel wird knapp. Zwischenziele sind Etappen – entscheidend ist das Endziel am ' + gFmt_(st.final.date) + '. Ermutigung hilft jetzt mehr als Druck.') });
  }
  return out;
}

// 1-2-7-Regel: Ab wann ist der nächste Delfin einer Unterlektion möglich? (null = sofort)
function nextDolphinDate_(doc) {
  const n = (doc && doc.count) || 0;
  if (n <= 0 || n >= 3) return null;
  const hist = (doc.history || []).filter(h => h && h.date);
  const first = hist[0] ? hist[0].date : doc.lastDate;
  const last = hist[n - 1] ? hist[n - 1].date : doc.lastDate;
  if (!first || !last) return null;
  if (n === 1) return gStr_(gDay_(last) + 1);
  return gStr_(Math.max(gDay_(first) + 7, gDay_(last) + 1));
}

// Delfin-Quote aus den Versuchen (nur Wörter des aktuellen Buches zählen).
function dolphinScores(session) {
  const scores = (session.attemptScores || []).map(a => {
    const need = a.attempt === 1 ? DOLPHIN_PCT_FIRST : DOLPHIN_PCT_RETRY;
    return { attempt: a.attempt, pct: a.total ? Math.floor(100 * a.correct / a.total) : 0, need, ok: a.total > 0 && a.correct * 100 >= need * a.total };
  });
  const q = scores.find(a => a.ok);
  const best = scores.reduce((m, a) => (!m || a.pct > m.pct ? a : m), null) || { pct: 0, attempt: 1, need: DOLPHIN_PCT_FIRST };
  const used = q || best;
  return { ok: !!q, pct: used.pct, attempt: used.attempt, need: used.need, firstPct: scores[0] ? scores[0].pct : null };
}

// Wie sicher sind die Wörter? Jedes Wort zählt gleich viel, nie geübte Wörter zählen als 0 %.
// Pro Wort zählen die letzten 3 Antworten (ältere Daten ohne "recent": Gesamtbilanz).
function wordSureness(s) {
  if (!s) return null;
  if (Array.isArray(s.recent) && s.recent.length) return s.recent.filter(Boolean).length / s.recent.length;
  const n = (s.correct || 0) + (s.wrong || 0);
  return n > 0 ? (s.correct || 0) / n : null;
}
function wordsMastery(words, statsMap) {
  let sum = 0, practiced = 0;
  words.forEach(w => {
    const v = wordSureness(statsMap[w.wid]);
    if (v !== null) { practiced++; sum += v; }
  });
  if (!practiced) return null;
  return { pct: Math.round((100 * sum) / words.length), practiced, total: words.length };
}
function masteryLabel(m, suffix) {
  return m.pct + '% sicher' + (suffix || '') + (m.practiced < m.total ? ' · ' + m.practiced + ' von ' + m.total + ' Wörtern geübt' : '');
}
function paintMastery(fill, label, m, suffix) {
  if (!m) { label.textContent = 'Noch nicht geübt'; fill.style.width = '0%'; return; }
  fill.style.width = m.pct + '%';
  fill.style.background = m.pct >= 80 ? 'var(--good)' : m.pct >= 50 ? 'var(--warn)' : 'var(--bad)';
  label.textContent = masteryLabel(m, suffix);
}

function topLevelCount(cfg) {
  if (!cfg.chapters.some(c => c.group)) return cfg.chapters.length;
  return new Set(cfg.chapters.map(c => c.group)).size;
}

function buildChapterPicker(cfg) {
  const hasGroups = cfg.chapters.some(c => c.group);
  if (!hasGroups) {
    const grid = el('div', { class: 'grid' });
    cfg.chapters.forEach((c, idx) => grid.appendChild(chapterCard(c, idx)));
    return grid;
  }
  const wrap = el('div', { style: 'display:flex;flex-direction:column;gap:16px;' });
  let lastGroup = null;
  let grid = null;
  cfg.chapters.forEach((c, idx) => {
    if (c.group !== lastGroup) {
      lastGroup = c.group;
      wrap.appendChild(el('div', { class: 'group-heading' }, c.group));
      grid = el('div', { class: 'grid' });
      wrap.appendChild(grid);
    }
    grid.appendChild(chapterCard(c, idx));
  });
  return wrap;
}

async function startQuiz(chapterIdx) {
  const cfg = langCfg();
  app.innerHTML = '';
  app.appendChild(el('div', { class: 'card center-col' }, [el('div', { class: 'big-check' }, 'Wird vorbereitet …')]));

  const chapter = cfg.chapters[chapterIdx];

  const statsMap = await fetchStatsMap(cfg);
  const prevBooks = await loadPrevBooks(cfg.key, currentBook);
  const extraWords = pickExtraWords(cfg, chapterIdx, statsMap, prevBooks);

  const chapterWordsArr = chapter.words.map(w => ({ foreign: w[cfg.foreignField], de: w.de, wid: w.wid, chapterIdx, isOld: false, quizDir: randomDir(),
    statsCollection: cfg.statsCollection, srcBook: null, srcTitle: chapter.title }));
  const extraWordsArr = extraWords.map(w => ({ foreign: w.foreign, de: w.de, wid: w.wid, chapterIdx: w.chapterIdx, isOld: true, quizDir: randomDir(),
    statsCollection: w.statsCollection, srcBook: w.srcBook, srcTitle: w.srcTitle }));

  const tally = {};
  chapterWordsArr.concat(extraWordsArr).forEach(w => { tally[w.wid] = Object.assign({}, w, { results: [], inputs: [], notes: [] }); });

  const session = {
    lang: cfg.key,
    bookIdx: currentBook,
    attemptScores: [],
    chapterIdx,
    chapterTitle: chapter.title,
    attempt: 1,
    maxAttempts: 3,
    chapterWords: chapterWordsArr,
    extraWords: extraWordsArr,
    extraStillNeeded: new Set(extraWordsArr.map(w => w.wid)),
    tally,
  };
  runAttempt(session);
}

// ---------- ANGEFANGENE ABFRAGE MERKEN (auf diesem Gerät) ----------
const RESUME_KEY = 'wortschatz.activeQuiz.v1' + (TEST_MODE ? '.test' : '');
const RESUME_MAX_AGE = 7 * 24 * 3600 * 1000;
function saveProgress(phase, session, extra) {
  try {
    const data = { v: 1, savedAt: Date.now(), phase,
      session: Object.assign({}, session, { extraStillNeeded: Array.from(session.extraStillNeeded) }),
      extra: extra || null };
    localStorage.setItem(RESUME_KEY, JSON.stringify(data));
  } catch (e) { /* z. B. privater Modus: dann eben ohne Merken */ }
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(RESUME_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || !d.session || !LANGS[d.session.lang] || Date.now() - d.savedAt > RESUME_MAX_AGE) { clearProgress(); return null; }
    d.session.extraStillNeeded = new Set(d.session.extraStillNeeded || []);
    return d;
  } catch (e) { return null; }
}
function clearProgress() { try { localStorage.removeItem(RESUME_KEY); } catch (e) { /* egal */ } }
function resumeProgress(d) {
  const s = d.session;
  currentLang = s.lang;
  currentBook = s.bookIdx == null ? null : s.bookIdx;
  if (d.phase === 'quiz') {
    const a = d.extra;
    // Eine schon beantwortete, aber noch nicht weitergeklickte Frage überspringen
    while (a.pos < a.order.length && a.correctThisAttempt[a.order[a.pos].wid] !== undefined) a.pos++;
    if (a.pos >= a.order.length) return finishAttempt(s, a);
    renderQuizQuestion(s, a);
  } else if (d.phase === 'result') {
    renderAttemptResult(s, d.extra);
  } else if (d.phase === 'sentences') {
    renderSentences(s);
  } else if (d.phase === 'submit') {
    sendSubmission(cfgFor(s.lang, s.bookIdx), s, d.extra.classified, d.extra.payload);
  }
}
function resumeCard() {
  const d = loadProgress();
  if (!d) return null;
  const s = d.session;
  const cfg = cfgFor(s.lang, s.bookIdx);
  let where;
  let nextPos = d.phase === 'quiz' ? d.extra.pos : 0;
  if (d.phase === 'quiz') while (nextPos < d.extra.order.length && d.extra.correctThisAttempt[d.extra.order[nextPos].wid] !== undefined) nextPos++;
  if (d.phase === 'quiz') where = 'Frage ' + Math.min(nextPos + 1, d.extra.order.length) + ' von ' + d.extra.order.length + ' · Versuch ' + s.attempt + ' von ' + s.maxAttempts;
  else if (d.phase === 'result') where = 'Versuch ' + s.attempt + ' ist fertig – noch nicht eingereicht';
  else if (d.phase === 'sentences') where = 'Fast fertig – Satz-Training ' + Math.min((s.sentences || []).filter(x => x.done).length + 1, (s.sentences || []).length) + ' von ' + (s.sentences || []).length;
  else where = 'Fertig – muss nur noch eingereicht werden';
  const buttons = [el('button', { class: 'primary', onclick: () => resumeProgress(d) }, d.phase === 'submit' ? 'Jetzt einreichen' : 'Weitermachen')];
  if (d.phase !== 'submit') buttons.push(el('button', { onclick: (ev) => { clearProgress(); const c = ev.target.closest('.card'); if (c) c.remove(); } }, 'Verwerfen'));
  return el('div', { class: 'card', style: 'border:2px solid var(--accent);display:flex;flex-direction:column;gap:8px;' }, [
    el('div', { class: 'section-title' }, '📌 Angefangene Abfrage'),
    el('div', { style: 'font-weight:600;font-size:16px;' }, cfg.flag + ' ' + (cfg.bookLabel || cfg.label) + ' · ' + s.chapterTitle),
    el('div', { style: 'color:var(--ink-soft);font-size:14px;' }, where),
    el('div', { class: 'toolbar' }, buttons),
  ]);
}

function runAttempt(session) {
  const queueWords = session.chapterWords.concat(
    session.extraWords   // jeder Versuch: wieder ALLE Wörter (Lektion + alle Wiederholungswörter)
  );
  const order = shuffle(queueWords);
  const attemptState = { pos: 0, order, correctThisAttempt: {}, answers: {} };
  saveProgress('quiz', session, attemptState);
  renderQuizQuestion(session, attemptState);
}

function renderQuizQuestion(session, attemptState) {
  const cfg = cfgFor(session.lang, session.bookIdx);
  homeBtn.hidden = false;
  langBtn.hidden = false;
  crumb.textContent = session.chapterTitle + ' · Versuch ' + session.attempt + '/' + session.maxAttempts;
  app.innerHTML = '';

  if (attemptState.pos >= attemptState.order.length) {
    return finishAttempt(session, attemptState);
  }

  const word = attemptState.order[attemptState.pos];
  const total = attemptState.order.length;

  const progress = el('div', { class: 'progress-row' }, [
    el('div', { class: 'progress-track' }, el('div', { class: 'progress-fill', style: 'width:' + Math.round(100 * attemptState.pos / total) + '%' })),
    el('span', { style: 'font-size:12px;color:var(--ink-soft);white-space:nowrap;' }, (attemptState.pos + 1) + ' / ' + total),
  ]);

  const feedback = el('div', { class: 'feedback', id: 'feedback' });
  const input = el('input', { type: 'text', id: 'answerInput', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: word.quizDir === 'f2de' ? 'Deutsche Übersetzung …' : (cfg.adjInto + ' Übersetzung …') });

  let answered = false;
  let fixing = false;   // Korrekturrunde, wenn nur ein Akzent/Sonderzeichen falsch war (zählt nicht)

  const submitAnswer = () => {
    if (answered) return;
    const val = input.value;
    if (!val.trim()) return;
    const notes = attemptState.notes = attemptState.notes || {};
    if (fixing) {
      answered = true;
      const ok = checkAnswer(val, word);
      notes[word.wid] = ok ? 'accent-fixed' : 'accent';
      saveProgress('quiz', session, attemptState);
      feedback.style.color = '';
      feedback.textContent = ok ? '✓ Genau so! Merk dir das Zeichen – diesmal zählt das Wort noch als Fehler.' : ('✗ Richtig wäre: ' + answerWord(word));
      feedback.className = 'feedback ' + (ok ? 'good' : 'bad');
      return lockAnswer();
    }
    let correct = checkAnswer(val, word);
    if (notes[word.wid]) correct = false;   // nach Neuladen während der Korrektur bleibt es ein Fehler
    attemptState.correctThisAttempt[word.wid] = correct;
    (attemptState.answers = attemptState.answers || {})[word.wid] = val.trim();
    const diffs = (!correct && session.lang === 'fr' && !notes[word.wid]) ? accentOnlyDiff(val, word) : null;
    if (diffs) {
      notes[word.wid] = 'accent';
      saveProgress('quiz', session, attemptState);
      fixing = true;
      feedback.textContent = accentHintText(diffs);
      feedback.className = 'feedback';
      feedback.style.color = 'var(--warn)';
      checkBtn.textContent = 'Verbessert – prüfen';
      nextBtn.hidden = false;
      setTimeout(() => input.focus(), 30);
      return;
    }
    answered = true;
    saveProgress('quiz', session, attemptState);
    feedback.textContent = correct ? '✓ Richtig!' : ('✗ Richtig wäre: ' + answerWord(word));
    feedback.className = 'feedback ' + (correct ? 'good' : 'bad');
    lockAnswer();
  };
  const lockAnswer = () => {
    input.disabled = true;
    checkBtn.hidden = true;
    nextBtn.hidden = false;
    nextBtn.disabled = true; // kurze Sperre gegen Ghost-Clicks auf Touch-Geräten
    input.blur();
    setTimeout(() => { nextBtn.disabled = false; }, 350);
  };

  const goNext = () => {
    if (!answered && !fixing) return;
    attemptState.pos++;
    saveProgress('quiz', session, attemptState);
    renderQuizQuestion(session, attemptState);
  };

  const nextBtn = el('button', { class: 'primary', hidden: true, onclick: goNext }, attemptState.pos + 1 >= total ? 'Ergebnis anzeigen' : 'Weiter');

  const checkBtn = el('button', { class: 'primary', onclick: submitAnswer }, 'Prüfen');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { if (!answered) submitAnswer(); } });

  const tagRow = el('div', { class: 'toolbar', style: 'justify-content:center;' }, [
    word.isOld ? el('span', { class: 'pill ' + (word.srcBook ? 'book' : 'old') }, (word.srcBook ? '📗 ' : '🔁 Wiederholung · ') + word.srcTitle) : null,
    el('span', { class: 'pill' }, dirLabel(word.quizDir, cfg)),
  ]);

  app.appendChild(el('div', { class: 'card center-col' }, [
    progress,
    tagRow,
    el('div', { class: 'quiz-sub' }, word.quizDir === 'f2de' ? 'Übersetze ins Deutsche' : ('Übersetze ins ' + cfg.adjInto)),
    el('div', { class: 'quiz-prompt' }, promptWord(word)),
    input,
    el('div', { class: 'toolbar', style: 'justify-content:center;' }, [checkBtn, nextBtn]),
    feedback,
  ]));

  setTimeout(() => input.focus(), 30);
}

function finishAttempt(session, attemptState) {
  attemptState.order.forEach(w => {
    const wasCorrect = attemptState.correctThisAttempt[w.wid];
    if (wasCorrect === undefined) return;
    session.tally[w.wid].results.push(!!wasCorrect);
    const t = session.tally[w.wid];
    (t.inputs = t.inputs || []).push((attemptState.answers && attemptState.answers[w.wid]) || '');
    (t.notes = t.notes || []).push((attemptState.notes && attemptState.notes[w.wid]) || '');
    if (w.isOld && wasCorrect) session.extraStillNeeded.delete(w.wid);
  });
  const counted0 = attemptState.order.filter(w => !w.srcBook);
  session.attemptScores.push({ attempt: session.attempt, correct: counted0.filter(w => attemptState.correctThisAttempt[w.wid]).length, total: counted0.length });
  const view = { order: attemptState.order, correctThisAttempt: attemptState.correctThisAttempt, answers: attemptState.answers || {}, notes: attemptState.notes || {} };
  saveProgress('result', session, view);
  renderAttemptResult(session, view);
}

function renderAttemptResult(session, attemptState) {
  const cfg = cfgFor(session.lang, session.bookIdx);
  homeBtn.hidden = false;
  langBtn.hidden = false;
  crumb.textContent = session.chapterTitle + ' · Ergebnis Versuch ' + session.attempt;
  app.innerHTML = '';

  const numCorrect = Object.values(attemptState.correctThisAttempt).filter(Boolean).length;
  const numTotal = attemptState.order.length;

  // Delfin-Quote: nur Wörter aus dem aktuellen Buch (keine Wiederholung aus Vorgängerbüchern)
  const counted = attemptState.order.filter(w => !w.srcBook);
  const cCorrect = counted.filter(w => attemptState.correctThisAttempt[w.wid]).length;
  const dNeed = session.attempt === 1 ? DOLPHIN_PCT_FIRST : DOLPHIN_PCT_RETRY;
  const dPct = counted.length ? Math.floor(100 * cCorrect / counted.length) : 0;
  const waitUntil = nextDolphinDate_(dolphinMap[dolKey(cfg, session.chapterIdx)]);
  const mustWait = SERVER_GOALS && waitUntil && gDay_(waitUntil) > gDay_(todayStr());
  const dolphinHint = isCompletedBook(cfg) ? null : '🐬 Delfin-Quote: ' + dPct + ' % (Ziel in diesem Versuch: ' + dNeed + ' %)' +
    (cCorrect * 100 >= dNeed * counted.length ? (mustWait ? ' – stark! Der nächste Delfin für diese Unterlektion ist aber erst ab dem ' + gLong_(waitUntil) + ' möglich.' : ' – geschafft!') : '');

  const list = el('div', {}, attemptState.order.map(w => {
    const c = attemptState.correctThisAttempt[w.wid];
    return el('div', { class: 'wordline' }, [
      el('div', { class: 'words' }, [
        el('span', { class: 'en' }, w.foreign),
        el('span', { class: 'de' }, w.de),
        w.isOld ? el('span', { class: 'pill ' + (w.srcBook ? 'book' : 'old') }, (w.srcBook ? '📗 ' : '') + w.srcTitle) : null,
        (!c && attemptState.answers && attemptState.answers[w.wid]) ? el('span', { style: 'color:var(--bad);font-size:13px;width:100%;' }, 'Deine Antwort: „' + attemptState.answers[w.wid] + '“' +
          ((attemptState.notes || {})[w.wid] ? ' – nur Akzent/Sonderzeichen' + ((attemptState.notes || {})[w.wid] === 'accent-fixed' ? ', danach richtig verbessert 👍' : '') : '')) : null,
      ]),
      el('span', { class: 'pill ' + (c ? 'good' : 'bad') }, c ? 'richtig' : 'falsch'),
    ]);
  }));

  const canRetry = session.attempt < session.maxAttempts;
  const retryBtn = el('button', { onclick: () => { session.attempt++; runAttempt(session); } }, 'Nochmal versuchen');
  const submitBtn = el('button', { class: 'primary', onclick: () => submitSession(session) }, 'Einreichen');

  const actionRow = canRetry
    ? el('div', { class: 'toolbar', style: 'justify-content:center;' }, [retryBtn, submitBtn])
    : el('div', { class: 'toolbar', style: 'justify-content:center;' }, [submitBtn]);

  app.appendChild(el('div', { class: 'card center-col' }, [
    el('div', { class: 'big-check' }, numCorrect + ' von ' + numTotal + ' richtig'),
    dolphinHint ? el('div', { class: 'quiz-sub', style: 'font-weight:600;' }, dolphinHint) : null,
    !canRetry
      ? el('div', { class: 'quiz-sub' }, 'Das war der letzte Versuch – bitte einreichen.')
      : el('div', { class: 'quiz-sub' }, 'Versuch ' + session.attempt + ' von ' + session.maxAttempts + ' · Beim nächsten Versuch kommen wieder alle Wörter dran'),
  ]));
  app.appendChild(el('div', { class: 'card' }, [
    el('div', { class: 'section-title' }, 'Deine Antworten'),
    list,
  ]));
  app.appendChild(actionRow);
}

function classifyWord(results) {
  const total = results.length;
  const correct = results.filter(Boolean).length;
  const wrong = total - correct;
  if (wrong === 0) return { level: 'good', label: '(' + correct + ' x richtig)' };
  if (correct === 0) return { level: 'bad', label: '(' + wrong + ' x falsch)' };
  return { level: 'warn', label: '(' + wrong + ' x falsch / ' + correct + ' x richtig)' };
}

// ===================== SATZ-TRAINING (zählt nicht für den Delfin) =====================
const LT_URL = 'https://api.languagetool.org/v2/check';
function sentenceWordCore(foreign) {
  // "to give, gave" -> "give"; "skates (pl)" -> "skates"; "un ami/une amie" -> "ami"
  let t = String(foreign || '').split(';')[0].replace(/\([^)]*\)/g, ' ').split(',')[0].split('/')[0];
  t = t.replace(/…|\.\.\./g, ' ').replace(/^\s*(to|the|a|an|le|la|les|l'|un|une|des|du)\s+/i, '').trim();
  return t.toLowerCase();
}
function pickSentenceWords(session) {
  const lesson = session.chapterWords.map(w => session.tally[w.wid]).filter(Boolean);
  const short = lesson.filter(t => String(t.foreign).split(/\s+/).length <= 4);
  const base = short.length >= 3 ? short : lesson;
  const wrong = shuffle(base.filter(t => t.results.some(r => !r)));
  const right = shuffle(base.filter(t => !t.results.some(r => !r)));
  let chosen = wrong.slice(0, 3).concat(right).slice(0, 3);
  if (chosen.length < 3) {   // sehr kurze Lektion: mit Wiederholungswörtern aus dem aktuellen Buch auffüllen
    const extra = shuffle(session.extraWords.map(w => session.tally[w.wid]).filter(t => t && !t.srcBook && !chosen.includes(t)));
    chosen = chosen.concat(extra).slice(0, 3);
  }
  return chosen.map(t => ({ wid: t.wid, word: t.foreign, de: t.de, wasWrong: t.results.some(r => !r),
    first: null, firstIssues: null, final: null, finalIssues: null, checks: 0, checked: false, done: false }));
}
function mapLtMatches(data, text) {
  return ((data && data.matches) || []).slice(0, 8).map(m => ({
    part: text.substr(m.offset, m.length), offset: m.offset, length: m.length,
    message: m.message || m.shortMessage || '',
    suggestions: (m.replacements || []).slice(0, 2).map(r => r.value),
  }));
}
async function checkSentence(text, langKey) {
  const language = langKey === 'fr' ? 'fr' : 'en-GB';
  try {   // direkt vom Gerät aus (bevorzugt)
    const res = await fetch(LT_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ text, language }).toString() });
    if (!res.ok) throw new Error('lt_' + res.status);
    return mapLtMatches(await res.json(), text);
  } catch (e) {
    try {   // Ersatzweg über das Google-Skript
      const r = await apiPost({ action: 'check', text, language });
      return mapLtMatches(r.result, text);
    } catch (e2) { return null; }
  }
}
function issuesEl(text, issues) {
  if (!issues) return el('div', { class: 'feedback', style: 'color:var(--ink-soft);' }, 'Die Prüfung ist gerade nicht erreichbar – kein Problem, dein Satz wird trotzdem gespeichert.');
  if (!issues.length) return el('div', { class: 'feedback good' }, '✓ Super – keine Rechtschreib- oder Grammatikfehler gefunden!');
  return el('div', { style: 'display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;' }, [
    el('div', { style: 'font-weight:700;color:var(--warn);' }, '🔍 Das solltest du dir nochmal anschauen:'),
    ...issues.map(i => el('div', { class: 'dol-note', style: 'background:var(--warn-bg);text-align:left;' }, [
      el('span', { style: 'font-weight:700;text-decoration:underline wavy var(--bad);' }, i.part || '…'),
      i.suggestions.length ? el('span', {}, ' → besser: „' + i.suggestions.join('“ oder „') + '“') : null,
      el('div', { style: 'font-size:12px;color:var(--ink-soft);margin-top:3px;' }, i.message),
    ])),
  ]);
}
function renderSentences(session) {
  const cfg = cfgFor(session.lang, session.bookIdx);
  const list = session.sentences;
  const idx = list.findIndex(x => !x.done);
  if (idx < 0) { session.sentencesDone = true; saveProgress('sentences', session); return doSubmit(session); }
  const it = list[idx];
  homeBtn.hidden = false; langBtn.hidden = false;
  crumb.textContent = session.chapterTitle + ' · Satz-Training';
  app.innerHTML = '';
  const langAdj = cfg.key === 'fr' ? 'französischen' : 'englischen';
  const input = el('textarea', { id: 'sentenceInput', rows: '3', placeholder: 'Dein Satz …', autocapitalize: 'sentences', spellcheck: 'false',
    style: 'width:100%;font-size:17px;font-family:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical;' });
  input.value = it.final || it.first || '';
  const result = el('div', { style: 'width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;' });
  const hint = el('div', { class: 'quiz-sub', style: 'color:var(--warn);' });
  const checkBtn = el('button', { class: 'primary' }, 'Prüfen');
  const nextBtn = el('button', { class: 'primary', hidden: true }, idx === list.length - 1 ? 'Fertig – Ergebnis einreichen' : 'Nächster Satz');
  const finish = () => { it.done = true; saveProgress('sentences', session); renderSentences(session); };
  nextBtn.addEventListener('click', finish);
  const showAfterCheck = (issues) => {
    result.innerHTML = '';
    result.appendChild(issuesEl(input.value.trim(), issues));
    nextBtn.hidden = false;
    if (issues && issues.length && it.checks < 2) {
      checkBtn.textContent = 'Verbessert – nochmal prüfen';
      checkBtn.hidden = false;
      result.appendChild(el('div', { class: 'quiz-sub' }, 'Du kannst deinen Satz oben verbessern und noch einmal prüfen – oder einfach weitermachen.'));
    } else { checkBtn.hidden = true; input.readOnly = true; }
  };
  checkBtn.addEventListener('click', async () => {
    const text = input.value.trim().replace(/\s+/g, ' ');
    if (text.split(' ').filter(Boolean).length < 3) { hint.textContent = 'Schreib bitte einen ganzen Satz (mindestens 3 Wörter).'; return; }
    const core = sentenceWordCore(it.word);
    const stem = core.split(' ')[0].slice(0, Math.max(3, Math.min(5, core.split(' ')[0].length)));
    it.wordUsed = !stem || text.toLowerCase().includes(stem);
    hint.textContent = it.wordUsed ? '' : 'Tipp: Kommt „' + it.word + '“ in deinem Satz vor?';
    checkBtn.disabled = true; checkBtn.textContent = 'Wird geprüft …';
    const issues = await checkSentence(text, cfg.key);
    checkBtn.disabled = false;
    it.checks++;
    if (it.checks === 1) { it.first = text; it.firstIssues = issues; }
    it.final = text; it.finalIssues = issues; it.checked = issues !== null;
    saveProgress('sentences', session);
    showAfterCheck(issues);
  });
  app.appendChild(el('div', { class: 'card center-col' }, [
    el('div', { class: 'toolbar', style: 'justify-content:center;' }, [
      el('span', { class: 'pill old' }, '✍️ Satz ' + (idx + 1) + ' von ' + list.length),
      el('span', { class: 'pill' }, 'Training – zählt nicht für deinen Delfin'),
    ]),
    el('div', { class: 'quiz-sub' }, 'Fast geschafft! Bilde einen ' + langAdj + ' Satz mit diesem Wort:'),
    el('div', { class: 'quiz-prompt' }, it.word),
    el('div', { class: 'quiz-sub' }, '(' + it.de + ')'),
    input,
    hint,
    el('div', { class: 'toolbar', style: 'justify-content:center;' }, [checkBtn, nextBtn]),
    result,
    el('div', { style: 'font-size:11px;color:var(--ink-soft);' }, [
      'Rechtschreib- und Grammatikprüfung: ',
      el('a', { href: 'https://languagetool.org', target: '_blank', rel: 'noopener' }, 'LanguageTool'),
      ' – dein Satz wird dafür an LanguageTool geschickt (ohne deinen Namen). Ob der Satz Sinn ergibt, prüft das Programm nicht.',
    ]),
  ]));
  if (it.checks > 0) showAfterCheck(it.finalIssues);
  setTimeout(() => { if (!input.readOnly) input.focus(); }, 30);
}

// Französisch: Satz-Training erst ab Lektion 4 (vorher reicht der Wortschatz noch nicht für eigene Sätze)
const FR_SENTENCES_FROM_LESSON = 4;
function sentencesEnabled(session) {
  if (session.lang !== 'fr') return true;
  const ch = (cfgFor(session.lang, session.bookIdx).chapters || [])[session.chapterIdx];
  const m = ch && /Lektion\s+(\d+)/.exec(ch.group || ch.title || '');
  return !m || Number(m[1]) >= FR_SENTENCES_FROM_LESSON;
}

function submitSession(session) {
  if (!session.sentencesDone && !sentencesEnabled(session)) { session.sentences = []; session.sentencesDone = true; }
  if (!session.sentencesDone) {
    if (!session.sentences) session.sentences = pickSentenceWords(session);
    if (session.sentences.length) { saveProgress('sentences', session); return renderSentences(session); }
    session.sentencesDone = true;
  }
  return doSubmit(session);
}

async function doSubmit(session) {
  const cfg = cfgFor(session.lang, session.bookIdx);
  const wordsWithResults = Object.values(session.tally).filter(w => w.results.length > 0);
  const classified = wordsWithResults.map(w => ({ ...w, ...classifyWord(w.results) }));
  const sc = dolphinScores(session);
  const completed = isCompletedBook(cfg);
  const key = completed ? null : dolKey(cfg, session.chapterIdx);

  const submission = {
    language: cfg.key,
    languageLabel: cfg.label,
    bookLabel: cfg.bookLabel || null,
    chapterTitle: session.chapterTitle,
    dolphin: {
      earned: false, pct: sc.pct, attempt: sc.attempt, neededPct: sc.need, firstAttemptPct: sc.firstPct,
      chapterCount: key ? dolCount(cfg, session.chapterIdx) : 0, chapterMax: DOLPHIN_MAX, total: totalDolphins(),
      reason: completed ? 'completed' : (sc.ok ? null : 'score'),
    },
    direction: 'mixed',
    attemptsUsed: session.attempt,
    submittedAt: new Date().toISOString(),
    nephewName: NEPHEW_NAME,
    words: classified.map(w => ({ foreign: w.foreign, de: w.de, chapterIdx: w.chapterIdx, chapterLabel: w.srcTitle, sourceBook: w.srcBook || null, isOld: w.isOld, quizDir: w.quizDir, results: w.results, answers: w.inputs || [], notes: w.notes || [], level: w.level, label: w.label })),
    sentences: (session.sentences || []).map(x => ({ word: x.word, de: x.de, wasWrong: x.wasWrong, first: x.first, final: x.final, wordUsed: x.wordUsed !== false,
      firstIssues: x.firstIssues, finalIssues: x.finalIssues, checked: x.checked })),
  };
  const payload = {
    action: 'submit',
    submissionId: 'sub_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    submission,
    stats: classified.map(w => {
      const c = w.results.filter(Boolean).length;
      return { collection: w.statsCollection || cfg.statsCollection, wid: w.wid, foreign: w.foreign, de: w.de, chapterIdx: w.chapterIdx, correct: c, wrong: w.results.length - c, results: w.results };
    }),
    dolphinKey: key,
    dolphinClaim: !!(key && sc.ok),
    bookKey: cfg.bookKey || null,
    chapterIdx: session.chapterIdx,
  };
  saveProgress('submit', session, { payload, classified });
  sendSubmission(cfg, session, classified, payload);
}

async function sendSubmission(cfg, session, classified, payload) {
  homeBtn.hidden = true;
  langBtn.hidden = true;
  crumb.textContent = session.chapterTitle + ' · Wird eingereicht';
  app.innerHTML = '';
  app.appendChild(el('div', { class: 'card center-col' }, [el('div', { class: 'big-check' }, 'Wird eingereicht …')]));

  let res = null, err = null;
  if (!apiConfigured()) err = 'Die App ist noch nicht mit dem Speicher verbunden.';
  else {
    try { res = await apiPost(payload); }
    catch (e) {
      err = e && e.message === 'test_not_ready'
        ? 'Testmodus ist im Google-Skript noch nicht aktiv. Es wurde nichts gespeichert und keine Mail verschickt.'
        : 'Das Ergebnis konnte nicht gespeichert werden. Bitte prüfe die Internetverbindung und versuche es nochmal.';
    }
  }
  if (err) return renderSubmitFailed(cfg, session, classified, payload, err);

  crumb.textContent = session.chapterTitle + ' · Eingereicht';
  clearProgress();
  apiInvalidate();
  if (res.dolphinKey && res.dolphinDoc) dolphinMap[res.dolphinKey] = res.dolphinDoc;
  const d = Object.assign({}, payload.submission.dolphin, res.dolphin || {});
  if (d.earned) renderDolphinCongrats(cfg, session, d, () => renderSubmitted(cfg, classified, null, d));
  else { updateDolphinTotal(); renderSubmitted(cfg, classified, null, d); }
}

function renderSubmitFailed(cfg, session, classified, payload, msg) {
  app.innerHTML = '';
  app.appendChild(el('div', { class: 'card center-col' }, [
    el('div', { class: 'big-check' }, '📡 Hoppla!'),
    el('div', { class: 'feedback bad' }, msg),
    el('div', { class: 'quiz-sub' }, 'Deine Antworten sind noch da. Tippe auf „Nochmal senden“, sobald du wieder Internet hast.'),
    el('div', { class: 'toolbar', style: 'justify-content:center;' }, [
      el('button', { class: 'primary', onclick: () => sendSubmission(cfg, session, classified, payload) }, 'Nochmal senden'),
      el('button', { onclick: () => renderHome() }, 'Verwerfen'),
    ]),
  ]));
}


function dolphinNote(d) {
  if (!d) return null;
  let t = null;
  if (d.earned) t = '🐬 Neuer Delfin verdient! (' + d.chapterCount + ' von ' + DOLPHIN_MAX + ' für diese Unterlektion · insgesamt ' + d.total + ')';
  else if (d.reason === 'wait') t = '🐬 Super gemacht! Den nächsten Delfin für diese Unterlektion kannst du ab dem ' + gLong_(d.nextDate) + ' holen – so bleiben die Wörter richtig lange im Kopf.';
  else if (d.reason === 'today') t = '🐬 Für diese Unterlektion hast du heute schon ' + DOLPHIN_PER_DAY + ' Delfine geholt. Morgen geht es weiter!';
  else if (d.reason === 'max') t = '🏆 Du hast schon alle ' + DOLPHIN_MAX + ' Delfine für diese Unterlektion – stark!';
  else if (d.reason === 'score') t = '🐬 Quote: ' + d.pct + ' %. Für einen Delfin brauchst du in einem Versuch mindestens ' + DOLPHIN_PCT_FIRST + ' % richtig. Beim nächsten Mal klappt es!';
  return t ? el('div', { class: 'dol-note' }, t) : null;
}

function renderSubmitted(cfg, classified, saveError, dolphin) {
  app.innerHTML = '';
  const needsPractice = classified.filter(w => w.level !== 'good');

  const summaryList = el('div', {}, classified.map(w => el('div', { class: 'wordline' }, [
    el('div', { class: 'words' }, [
      el('span', { class: 'en' }, w.foreign),
      el('span', { class: 'de' }, w.de),
      w.isOld ? el('span', { class: 'pill ' + (w.srcBook ? 'book' : 'old') }, (w.srcBook ? '📗 ' : '') + w.srcTitle) : null,
    ]),
    el('span', { class: 'tally ' + w.level }, w.label),
  ])));

  app.appendChild(el('div', { class: 'card center-col' }, [
    el('div', { class: 'big-check' }, '🎉 Geschafft, ' + NEPHEW_NICK + '!'),
    el('div', { class: 'quiz-sub' }, 'Deine Eltern bekommen eine Zusammenfassung.'),
    dolphinNote(dolphin),
    saveError ? el('div', { class: 'feedback bad' }, saveError) : null,
    el('button', { class: 'primary', onclick: () => renderHome() }, 'Zurück zur ' + cfg.chapterNoun + 'übersicht'),
  ]));

  app.appendChild(el('div', { class: 'card' }, [
    el('div', { class: 'section-title' }, 'Alle Wörter dieses Durchgangs'),
    summaryList,
  ]));

  if (needsPractice.length) {
    app.appendChild(el('div', { class: 'card', style: 'border-color:var(--warn);' }, [
      el('h3', {}, 'Für die Eltern: nochmal gezielt abfragen'),
      el('div', {}, needsPractice.map(w => el('div', { class: 'wordline' }, [
        el('div', { class: 'words' }, [
          el('span', { class: 'en' }, w.foreign),
          el('span', { class: 'de' }, w.de),
          w.isOld ? el('span', { class: 'pill ' + (w.srcBook ? 'book' : 'old') }, (w.srcBook ? '📗 ' : '') + w.srcTitle) : null,
        ]),
        el('span', { class: 'tally ' + w.level }, w.label),
      ]))),
    ]));
  }
}

if (TEST_MODE) {
  document.getElementById('testBanner').hidden = false;
  document.title = 'TEST · ' + document.title;
  const si = document.getElementById('simDateInput');
  si.value = simDate() || berlinDate();
  const applySim = (v) => {
    try { if (v) localStorage.setItem('wortschatz.simDate', v); else localStorage.removeItem('wortschatz.simDate'); } catch (e) { /* egal */ }
    si.value = simDate() || berlinDate();
    apiInvalidate();
    renderLanguageSelect();
  };
  si.addEventListener('change', () => applySim(si.value && si.value !== berlinDate() ? si.value : null));
  document.getElementById('simDateReset').addEventListener('click', () => applySim(null));
} else {
  const sb = document.getElementById('simBox'); if (sb) sb.remove();
}
renderLanguageSelect();
</script>
